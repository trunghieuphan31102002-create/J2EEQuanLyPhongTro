# ===== SERVER =====
# Local mac dinh 8080. Railway se set env PORT → Spring Boot tu dung port do.
server.port=${PORT:8080}

# ===== CORS =====
# Local de trong (FE+BE cung origin qua Vite proxy nen khong can CORS).
# Production: set env APP_CORS_ALLOWED_ORIGINS=https://<frontend>.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ===== DATABASE (MySQL) =====
# Local: cai MySQL 8.x, tao database 'rentalms' truoc khi chay.
#   CREATE DATABASE IF NOT EXISTS rentalms CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Production (Railway): override bang env vars SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rentalms?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ===== JWT =====
app.jwt.secret=RentalMSSecretKey2024VeryLongSecretKeyForJWTGeneration123456789
app.jwt.expiration=86400000

# ===== JACKSON =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== UPLOAD =====
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== VNPay Sandbox =====
# Dang ky tai https://sandbox.vnpayment.vn/devreg/
# Set env: VNPAY_TMN_CODE, VNPAY_HASH_SECRET
# Return URL (backend): {BACKEND_URL}/api/vnpay/return
# Frontend result URL: {FRONTEND_URL}/payment/result
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL:}
vnpay.version=2.1.0

# ===== FPT.AI eKYC =====
# Dang ky tai https://fpt.ai -> tao app -> lay API key
# Local: set bien moi truong FPT_EKYC_API_KEY, hoac dien truc tiep vao day (KHONG commit len git)
# Railway: vao Service -> Variables -> them FPT_EKYC_API_KEY
fpt.ekyc.api-key=${FPT_EKYC_API_KEY:}
fpt.ekyc.url=${FPT_EKYC_URL:https://api.fpt.ai/vision/idr/vnm}

# ===== LOGGING =====
logging.level.com.rentalms=DEBUG
logging.level.org.springframework.security=INFO
