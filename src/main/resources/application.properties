# ===== SERVER =====
# Local mac dinh 8080. Railway se set env PORT → Spring Boot tu dung port do.
server.port=${PORT:8080}

# ===== CORS =====
# Local de trong (FE+BE cung origin qua Vite proxy nen khong can CORS).
# Production: set env APP_CORS_ALLOWED_ORIGINS=https://<frontend>.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ===== DATABASE =====
# Default: H2 in-memory (cho local dev, khong can cai dat).
# Production (Railway): override bang env vars SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_DATASOURCE_DRIVER_CLASS_NAME, SPRING_JPA_DATABASE_PLATFORM.
spring.datasource.url=jdbc:h2:mem:rentalms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===== JWT =====
app.jwt.secret=RentalMSSecretKey2024VeryLongSecretKeyForJWTGeneration123456789
app.jwt.expiration=86400000

# ===== JACKSON =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== UPLOAD =====
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===== LOGGING =====
logging.level.com.rentalms=DEBUG
logging.level.org.springframework.security=INFO
